<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#24392d;font-size:22px}.title{font-size:30px;font-weight:700}.small{font-size:18px}</style>
<text x="35" y="50" class="title">逆纹切肉：切线横跨肌肉纤维</text>
