<text x="710" y="160">横线：纤维方向</text><text x="710" y="215">竖虚线：切线</text><text x="710" y="270" class="small">每段纤维变短</text>
<text x="95" y="385">先辨认纹理，再调整肉块位置；并非固定朝身体某个方向切。</text></svg>